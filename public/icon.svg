<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="95%">
      <stop offset="0%" stop-color="#0f3d26"/>
      <stop offset="55%" stop-color="#062116"/>
      <stop offset="100%" stop-color="#020d08"/>
    </radialGradient>
    <linearGradient id="ring" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#6ee7a8"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="wind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chamber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042a1b"/>
      <stop offset="100%" stop-color="#010a06"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="url(#glow)"/>
  <!-- Gehäuse des 3D-Druckers -->
  <rect x="96" y="88" width="320" height="336" rx="38" fill="url(#ring)"/>
  <rect x="96" y="88" width="320" height="336" rx="38" fill="none" stroke="#d1fae5" stroke-opacity="0.35" stroke-width="5"/>
  <!-- Bauraum -->
  <rect x="128" y="124" width="256" height="240" rx="20" fill="url(#chamber)"/>
  <rect x="128" y="124" width="256" height="240" rx="20" fill="none" stroke="#6ee7a8" stroke-opacity="0.45" stroke-width="4"/>
  <!-- Schiene und Druckkopf -->
  <rect x="128" y="186" width="256" height="14" fill="#6ee7a8"/>
  <rect x="216" y="176" width="80" height="48" rx="11" fill="url(#ring)" stroke="#d1fae5" stroke-opacity="0.5" stroke-width="3"/>
  <polygon points="241,224 271,224 256,254" fill="#d1fae5"/>
  <!-- Druckteil mit Schichten -->
  <rect x="208" y="264" width="96" height="62" rx="7" fill="url(#wind)"/>
  <g stroke="#a7f3d0" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <path d="M 214 277 H 298"/><path d="M 214 291 H 298"/><path d="M 214 305 H 298"/>
  </g>
  <!-- Druckplatte -->
  <rect x="148" y="326" width="216" height="14" rx="7" fill="#6ee7a8"/>
  <!-- Bedienfeld -->
  <circle cx="164" cy="394" r="8" fill="#d1fae5"/>
  <rect x="296" y="380" width="88" height="28" rx="9" fill="#053b27"/>
  <rect x="296" y="380" width="88" height="28" rx="9" fill="none" stroke="#6ee7a8" stroke-opacity="0.6" stroke-width="3"/>
  <path d="M 312 394 H 340" stroke="#6ee7a8" stroke-width="5" stroke-linecap="round"/>
</svg>
