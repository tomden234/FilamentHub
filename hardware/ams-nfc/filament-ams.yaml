# Erstellt: 05.11.2026 18:40 Uhr (Revision 1.202)
# FilamentHub: NFC-Leser im AMS 2 Pro (ESP32 + 5x RC522)
# Slot 1-4 = AMS-Slots, Slot 5 = externe Spule.
# In Home Assistant erscheinen die Sensoren sensor.filament_ams_slot_1_tag … slot_5_tag.
# Die FilamentHub-App findet sie automatisch und ordnet Spule ↔ Slot zu.
#
# Optional: Feuchte-/Temperatur-Sensor SHT31-D (oder SHT40 / AHT20), I2C, 3,3 V, z. B. in der Filament-Lagerbox:
#   Box:  SDA → GPIO21, SCL → GPIO32, VCC → 3V3, GND → GND → sensor.filament_ams_box_feuchte (Feuchte-Alarm)
#   Trockner: SDA → GPIO33, SCL → GPIO25, VCC → 3V3, GND → GND → sensor.filament_ams_trockner_feuchte (externer Spulentrockner mit der 5. Spule)
#   Ohne angeschlossenen Sensor läuft alles andere normal weiter (im Log steht dann nur eine Warnung).
#
# Optional: Status-LED (WS2812B-Streifen, 5 V) am SELBEN ESP32, zeigt den Druckerstatus (statt eines zweiten ESP32 mit WLED):
#   Streifen: DIN → GPIO27, GND → GND (gemeinsam mit dem ESP32), 5V → eigenes 5-V-Netzteil (nicht der 3V3-Pin!)
#   → light.filament_ams_status_led + number.filament_ams_status_led_intensity. Die FilamentHub-App findet beides selbst
#   (gleiche Effekt-Namen wie WLED: Percent, Solid, Blink, Breathe) und legt die Automation an.
#   Ohne angeschlossenen Streifen läuft alles andere normal weiter.
#
# Optional: Warteschlange am Drucker (Revision 1.199):
#   Taster „Platte frei“ (19-mm-Metalltaster mit Leuchtring): C (Common) → GND, NO → GPIO26, NC frei lassen
#   (kein Widerstand nötig, der ESP hat einen eingebauten) → binary_sensor.filament_ams_platte_frei.
#   Drücken = Platte ist leer, der Pi startet den nächsten Druck der Warteschlange.
#   Rastet der Taster ein (bleibt unten): button_latching: "true" setzen.
#   Leuchtring: nur die 3-6-V- oder 5-V-Version an + → GPIO2, − → GND. Die 12-V-Version (dein Taster) FREI LASSEN.
#   GPIO2 ist auch die blaue LED auf dem ESP: sie leuchtet, wenn ein Druck wartet, und blinkt schnell = nicht gestartet.
#   Schaltplan: hardware/ams-nfc/wiring/7_taster_warteschlange.png
#   Streifen „Warteschlange“ (10 LEDs, Rest vom Status-Streifen): DIN → GPIO14, GND → GND, 5V → gleiches 5-V-Netzteil
#   Eine blaue LED je wartendem Druck. Grün = startet. Rot blinkend = nicht gestartet (Drucker druckt noch, Material fehlt, Drucker aus).
#
# Pins funktionieren auf ESP32-Boards mit 30 UND 38 Pins (DevKitC / NodeMCU, WROOM-32).

substitutions:
  name: filament-ams
  friendly_name: Filament AMS
  # Wie lange ein Tag „weg“ sein darf, bevor der Slot als leer gilt.
  # Die Spule dreht sich beim Drucken, der Tag ist dann kurz nicht vor dem Leser.
  remove_after: 10min
  # Nur eigene NTAG-Tags (7-Byte-Nummer, Text „04-A1-B2-C3-D4-E5-F6“ = 20 Zeichen) zählen.
  # Bambu-Spulen haben MIFARE-Classic-Chips mit 4-Byte-Nummer (11 Zeichen): die werden ignoriert,
  # die liest das AMS selbst und meldet sie an die App.
  own_uid_min: "20"
  # Empfangs-Verstärkung der RC522 (RFCfgReg): 0x70 = Maximum 48 dB (liest weiter, empfohlen bei billigen Modulen), 0x48 = Standard 33 dB
  rfid_gain: "0x70"
  # Anzahl LEDs am Streifen (60 pro Meter oder 144 pro Meter)
  led_count: "144"
  # Helligkeitsgrenze 0-1 (Netzteil 5 V 2 A: 0.15 = max ca. 1,3 A bei weiß bei 144 LEDs). Mit stärkerem Netzteil erhöhen.
  led_cap: "0.15"
  # Farbreihenfolge des Streifens. Passen die Farben nicht (Rot zeigt Grün usw.): GRB, RGB, BRG, RBG, GBR oder BGR probieren.
  # Üblich: GRB (WS2812B). Zeigt Rot ein Grün: RGB. Zeigt Rot ein Blau: BRG.
  led_order: "GRB"
  # Anzahl LEDs am Warteschlangen-Streifen (GPIO14)
  queue_led_count: "10"
  # Taster: "false" = federt zurück (Standard), "true" = rastet ein (jedes Umschalten zählt als Drücken)
  button_latching: "false"
  # Stand dieser Datei (zeigt die App im Testmenü, damit man sieht, ob die neue Firmware drauf ist)
  fw_revision: "1.202"

# Merker für den Test der Warteschlange (Zahl vor dem Test)
globals:
  - id: queue_before_test
    type: float
    initial_value: '0'

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: queue_led
          effect: "Warteschlange"
      # Klare Startwerte statt „Unbekannt“ in Home Assistant (leer = kein Tag)
      - binary_sensor.template.publish: { id: plate_free, state: false }
      - text_sensor.template.publish: { id: last_tag, state: "noch kein Tag gelesen" }
      - text_sensor.template.publish: { id: slot_1_tag, state: "" }
      - text_sensor.template.publish: { id: slot_2_tag, state: "" }
      - text_sensor.template.publish: { id: slot_3_tag, state: "" }
      - text_sensor.template.publish: { id: slot_4_tag, state: "" }
      - text_sensor.template.publish: { id: slot_5_tag, state: "" }

esp32:
  board: esp32dev
  framework:
    type: arduino

# DEBUG, damit im ESPHome-Protokoll jeder gelesene Tag erscheint („Found new tag …“ / „fremder Tag ignoriert“).
# Laute Bereiche bleiben auf INFO.
logger:
  level: DEBUG
  logs:
    sensor: INFO
    text_sensor: INFO
    light: INFO
    number: INFO
    binary_sensor: INFO
    sht3xd: INFO
    i2c: INFO
    wifi_signal: INFO
    internal_temperature: INFO
    api.service: INFO
    esp32_rmt_led_strip: INFO

api:
  encryption:
    key: !secret filament_ams_api_key

ota:
  - platform: esphome
    password: !secret filament_ams_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Filament-AMS Setup"

captive_portal:

# I2C für die optionalen Feuchte-Sensoren (GPIO22 ist schon RST der Leser, deshalb SCL auf GPIO32).
# Zwei getrennte Busse, weil der SHT31-D eine feste Adresse (0x44) hat: Box an Bus 1, externer Spulentrockner an Bus 2.
# 50 kHz statt 100 kHz: stabiler bei längeren Kabeln (bis ca. 1–2 m).
i2c:
  - id: bus_box
    sda: GPIO21
    scl: GPIO32
    frequency: 50kHz
    scan: true
  - id: bus_trockner
    sda: GPIO33
    scl: GPIO25
    frequency: 50kHz
    scan: true

# Test der Warteschlange (Testmenü der App): an = Taster zählt nur die LEDs runter, es startet kein Druck.
# Aus = alte Zahl kommt zurück.
switch:
  - platform: template
    id: queue_test
    name: "Warteschlange Test"
    icon: mdi:test-tube
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    turn_on_action:
      - lambda: 'id(queue_before_test) = id(queue_count).state;'
    turn_off_action:
      - number.set:
          id: queue_count
          value: !lambda 'return id(queue_before_test);'
      - number.set: { id: queue_mode, value: 0 }

  # RST aller 5 Leser (GPIO22) dauerhaft HIGH: Leser sind wach, nichts „schwebt“.
  # (Vorher war GPIO22 nur Reset-Pin von Leser 1 und blieb danach oft offen = Leser konnten in den Stromspar-Modus fallen.)
  # Wird beim Start vor den Lesern eingeschaltet (Hardware-Priorität) = sauberer Hard-Reset aller Leser.
  - platform: gpio
    id: rfid_rst
    pin: GPIO22
    restore_mode: ALWAYS_ON
    internal: true

# Gemeinsamer SPI-Bus (VSPI) für alle 5 Leser
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

# Je Leser eine eigene CS-Leitung (SDA am RC522). RST aller Leser an GPIO22.
# v1.142: Abfrage alle 250 ms (vorher 1 s) = Tag wird 4x schneller erkannt; SPI 1 MHz (statt 4 MHz) = stabiler bei langen Kabeln.
# Hinweis: nur 7-Byte-UID-Tags (NTAG) werden angenommen (own_uid_min). 4-Byte-Tags (MIFARE Classic/Bambu) werden absichtlich ignoriert -> own_uid_min "11" setzen, falls Tags 'gar nicht' gehen.
rc522_spi:
  - id: reader_1
    cs_pin: GPIO5
    update_interval: 250ms
    data_rate: 1MHz
    on_tag:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.stop: clear_1
              - text_sensor.template.publish: { id: slot_1_tag, state: !lambda "return x;" }
              - text_sensor.template.publish: { id: last_tag, state: !lambda 'return "Leser 1: " + x;' }
            else:
              - text_sensor.template.publish: { id: last_tag, state: !lambda 'return "Leser 1: " + x + " (ignoriert, kein NTAG)";' }
              - logger.log:
                  level: INFO
                  format: "Slot 1: fremder Tag %s ignoriert (kein 7-Byte-NTAG, z. B. Bambu-RFID)"
                  args: ["x.c_str()"]
    on_tag_removed:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.execute: clear_1
  - id: reader_2
    cs_pin: GPIO17
    update_interval: 250ms
    data_rate: 1MHz
    on_tag:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.stop: clear_2
              - text_sensor.template.publish: { id: slot_2_tag, state: !lambda "return x;" }
              - text_sensor.template.publish: { id: last_tag, state: !lambda 'return "Leser 2: " + x;' }
            else:
              - text_sensor.template.publish: { id: last_tag, state: !lambda 'return "Leser 2: " + x + " (ignoriert, kein NTAG)";' }
              - logger.log:
                  level: INFO
                  format: "Slot 2: fremder Tag %s ignoriert (kein 7-Byte-NTAG, z. B. Bambu-RFID)"
                  args: ["x.c_str()"]
    on_tag_removed:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.execute: clear_2
  - id: reader_3
    cs_pin: GPIO16
    update_interval: 250ms
    data_rate: 1MHz
    on_tag:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.stop: clear_3
              - text_sensor.template.publish: { id: slot_3_tag, state: !lambda "return x;" }
              - text_sensor.template.publish: { id: last_tag, state: !lambda 'return "Leser 3: " + x;' }
            else:
              - text_sensor.template.publish: { id: last_tag, state: !lambda 'return "Leser 3: " + x + " (ignoriert, kein NTAG)";' }
              - logger.log:
                  level: INFO
                  format: "Slot 3: fremder Tag %s ignoriert (kein 7-Byte-NTAG, z. B. Bambu-RFID)"
                  args: ["x.c_str()"]
    on_tag_removed:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.execute: clear_3
  - id: reader_4
    cs_pin: GPIO4
    update_interval: 250ms
    data_rate: 1MHz
    on_tag:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.stop: clear_4
              - text_sensor.template.publish: { id: slot_4_tag, state: !lambda "return x;" }
              - text_sensor.template.publish: { id: last_tag, state: !lambda 'return "Leser 4: " + x;' }
            else:
              - text_sensor.template.publish: { id: last_tag, state: !lambda 'return "Leser 4: " + x + " (ignoriert, kein NTAG)";' }
              - logger.log:
                  level: INFO
                  format: "Slot 4: fremder Tag %s ignoriert (kein 7-Byte-NTAG, z. B. Bambu-RFID)"
                  args: ["x.c_str()"]
    on_tag_removed:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.execute: clear_4
  - id: reader_5
    cs_pin: GPIO13
    update_interval: 250ms
    data_rate: 1MHz
    on_tag:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.stop: clear_5
              - text_sensor.template.publish: { id: slot_5_tag, state: !lambda "return x;" }
              - text_sensor.template.publish: { id: last_tag, state: !lambda 'return "Leser 5: " + x;' }
            else:
              - text_sensor.template.publish: { id: last_tag, state: !lambda 'return "Leser 5: " + x + " (ignoriert, kein NTAG)";' }
              - logger.log:
                  level: INFO
                  format: "Slot 5: fremder Tag %s ignoriert (kein 7-Byte-NTAG, z. B. Bambu-RFID)"
                  args: ["x.c_str()"]
    on_tag_removed:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.execute: clear_5

# Leuchtring des Tasters (GPIO2): an = Druck wartet, schnelles Blinken = nicht gestartet, aus = nichts in der Warteschlange
output:
  - platform: gpio
    id: button_led
    pin: GPIO2

# Alle 10 s: Chip-Version jedes Lesers abfragen (zeigt, ob SPI-Kabel und Strom stimmen) und die Verstärkung setzen
# (ein Leser-Neustart setzt sie zurück). 0x91/0x92 = echter MFRC522, 0x88/0xB2/0x12 = Nachbau (geht auch), 0x00/0xFF = keine Verbindung.
interval:
  - interval: 200ms
    then:
      - lambda: |-
          int mode = (int) id(queue_mode).state;
          int count = (int) id(queue_count).state;
          bool on;
          if (mode == 1) on = (millis() / 200) % 2 == 0;
          else if (mode == 2) on = true;
          else on = count > 0;
          if (on) id(button_led).turn_on(); else id(button_led).turn_off();
  - interval: 10s
    then:
      - lambda: |-
          // Zugriff auf die Register des Lesers (die ESPHome-Klasse bietet das nicht öffentlich an)
          struct Peek : public esphome::rc522::RC522 {
            uint8_t version() { return this->pcd_read_register(VERSION_REG); }
            uint8_t gain() { return this->pcd_read_register(RF_CFG_REG); }
            void set_gain(uint8_t v) { this->pcd_write_register(RF_CFG_REG, v); }
          };
          esphome::rc522::RC522 *readers[5] = {id(reader_1), id(reader_2), id(reader_3), id(reader_4), id(reader_5)};
          esphome::text_sensor::TextSensor *out[5] = {id(reader_1_state), id(reader_2_state), id(reader_3_state), id(reader_4_state), id(reader_5_state)};
          const uint8_t want = ${rfid_gain};
          for (int i = 0; i < 5; i++) {
            char buf[64];
            if (readers[i]->is_failed()) {
              snprintf(buf, sizeof(buf), "Fehler beim Start (Kabel/Strom pruefen)");
            } else {
              Peek *p = static_cast<Peek *>(readers[i]);
              uint8_t v = p->version();
              if (v == 0x00 || v == 0xFF) {
                snprintf(buf, sizeof(buf), "Keine Verbindung (0x%02X): SDA/SCK/MOSI/MISO/3V3 pruefen", v);
              } else {
                if ((p->gain() & 0x70) != (want & 0x70)) p->set_gain(want);
                snprintf(buf, sizeof(buf), "OK (Chip 0x%02X)", v);
              }
            }
            if (out[i]->state != buf) out[i]->publish_state(buf);
          }

# Slot erst nach "remove_after" als leer melden (Spule dreht sich beim Drucken)
script:
  # Taster gedrückt: im Test eine LED weniger (der Pi merkt nichts), sonst Impuls „Platte frei“ an den Pi
  - id: button_pressed
    mode: single
    then:
      - if:
          condition:
            switch.is_on: queue_test
          then:
            - number.set:
                id: queue_count
                value: !lambda 'return id(queue_count).state > 0 ? id(queue_count).state - 1 : 0;'
            - number.set: { id: queue_mode, value: 2 }
            - delay: 300ms
            - number.set: { id: queue_mode, value: 0 }
          else:
            - script.execute: plate_pulse
  - id: plate_pulse
    mode: single
    then:
      - binary_sensor.template.publish: { id: plate_free, state: true }
      - delay: 500ms
      - binary_sensor.template.publish: { id: plate_free, state: false }
  - id: clear_1
    mode: restart
    then:
      - delay: ${remove_after}
      - text_sensor.template.publish: { id: slot_1_tag, state: "" }
  - id: clear_2
    mode: restart
    then:
      - delay: ${remove_after}
      - text_sensor.template.publish: { id: slot_2_tag, state: "" }
  - id: clear_3
    mode: restart
    then:
      - delay: ${remove_after}
      - text_sensor.template.publish: { id: slot_3_tag, state: "" }
  - id: clear_4
    mode: restart
    then:
      - delay: ${remove_after}
      - text_sensor.template.publish: { id: slot_4_tag, state: "" }
  - id: clear_5
    mode: restart
    then:
      - delay: ${remove_after}
      - text_sensor.template.publish: { id: slot_5_tag, state: "" }

# Status-LED: ein Streifen am selben ESP32 (GPIO27 ist frei). Die App steuert ihn wie einen WLED-Streifen:
# Effekte heißen wie bei WLED, damit sie ihn erkennt: "Percent" (Fortschrittsbalken), "Solid", "Blink", "Breathe".
# Die Länge des Balkens steht im Regler "Status LED Intensity" (0-255 = 0-100 %), den die App aus dem Druckfortschritt setzt.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: GPIO27
    num_leds: ${led_count}
    chipset: WS2812
    rgb_order: ${led_order}
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    # Ohne Gamma-Kurve (Standard 2.8 würde bei kleinen Werten die Farben verfälschen, z. B. Bernstein wird Gelbgrün).
    gamma_correct: 1.0
    effects:
      # Einfarbig (Pause, Fertig)
      - addressable_lambda:
          name: "Solid"
          update_interval: 1s
          lambda: |-
            it.all() = current_color * (uint8_t) (255 * ${led_cap});
      # Fortschrittsbalken: so viele LEDs an, wie der Regler sagt (mindestens 1)
      - addressable_lambda:
          name: "Percent"
          update_interval: 500ms
          lambda: |-
            int n = it.size();
            int on = (int) roundf(n * id(led_intensity).state / 255.0f);
            if (on < 1) on = 1;
            if (on > n) on = n;
            for (int i = 0; i < n; i++) it[i] = (i < on) ? current_color * (uint8_t) (255 * ${led_cap}) : Color::BLACK;
      # Farbtest: zeigt nacheinander Rot, Grün, Blau (je 2 s), egal welche Farbe gewählt ist. Zum Finden von led_order.
      - addressable_lambda:
          name: "Farbtest"
          update_interval: 200ms
          lambda: |-
            int phase = (millis() / 2000) % 3;
            Color c = (phase == 0) ? Color(255, 0, 0) : ((phase == 1) ? Color(0, 255, 0) : Color(0, 0, 255));
            it.all() = c * (uint8_t) (255 * ${led_cap});
      # Blinken (Fehler): 0,5 s an, 0,5 s aus
      - addressable_lambda:
          name: "Blink"
          update_interval: 500ms
          lambda: |-
            static bool on = false;
            on = !on;
            it.all() = on ? current_color * (uint8_t) (255 * ${led_cap}) : Color::BLACK;
      # Atmen (Trocknung): langsam heller und dunkler, ca. 4 s pro Zug
      - addressable_lambda:
          name: "Breathe"
          update_interval: 40ms
          lambda: |-
            float t = (millis() % 4000) / 4000.0f;
            float b = 0.15f + 0.85f * (0.5f - 0.5f * cosf(t * 6.2831853f));
            it.all() = current_color * (uint8_t) (255.0f * ${led_cap} * b);

  # Warteschlange: so viele LEDs wie Drucke warten (Zahl setzt der Pi). Modus 1 = rot blinken, 2 = grün (startet).
  - platform: esp32_rmt_led_strip
    id: queue_led
    name: "Warteschlange LED"
    pin: GPIO14
    num_leds: ${queue_led_count}
    chipset: WS2812
    rgb_order: ${led_order}
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    gamma_correct: 1.0
    effects:
      - addressable_lambda:
          name: "Warteschlange"
          update_interval: 100ms
          lambda: |-
            int n = it.size();
            int count = (int) id(queue_count).state;
            int mode = (int) id(queue_mode).state;
            uint8_t cap = (uint8_t) (255 * ${led_cap});
            if (mode == 1) {
              bool on = (millis() / 300) % 2 == 0;
              it.all() = on ? Color(255, 0, 0) * cap : Color::BLACK;
            } else if (mode == 2) {
              it.all() = Color(0, 255, 0) * cap;
            } else {
              for (int i = 0; i < n; i++) it[i] = (i < count) ? Color(0, 90, 255) * cap : Color::BLACK;
            }

number:
  - platform: template
    id: queue_count
    name: "Warteschlange"
    icon: mdi:tray-full
    min_value: 0
    max_value: 10
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: queue_mode
    name: "Warteschlange Modus"
    icon: mdi:traffic-light
    min_value: 0
    max_value: 2
    step: 1
    initial_value: 0
    optimistic: true
    mode: box
  - platform: template
    id: led_intensity
    name: "Status LED Intensity"
    icon: mdi:chart-timeline-variant
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 128
    optimistic: true
    restore_value: true
    mode: slider

binary_sensor:
  # Taster selbst (GPIO26 → GND), nur intern. Jedes Drücken wird zu einem kurzen Impuls „Platte frei“.
  - platform: gpio
    id: button_raw
    internal: true
    pin:
      number: GPIO26
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_press:
      - script.execute: button_pressed
    on_release:
      - if:
          condition:
            lambda: 'return ${button_latching};'
          then:
            - script.execute: button_pressed
  # Für Home Assistant und den Pi: 0,5 s „an“ je Drücken (egal ob der Taster federt oder einrastet)
  - platform: template
    id: plate_free
    name: "Platte frei"
    icon: mdi:gesture-tap-button

text_sensor:
  # Stand der Firmware (Revision), fürs Testmenü der App
  - platform: template
    id: fw_rev
    name: "Firmware"
    icon: mdi:chip
    entity_category: diagnostic
    lambda: 'return {"${fw_revision}"};'
    update_interval: 10min
  # Zum Testen: zuletzt gelesener Tag an irgendeinem Leser (auch ignorierte)
