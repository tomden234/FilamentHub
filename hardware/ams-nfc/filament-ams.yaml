# FilamentHub: NFC-Leser im AMS 2 Pro (ESP32 + 5x RC522)
# Slot 1-4 = AMS-Slots, Slot 5 = externe Spule.
# In Home Assistant erscheinen die Sensoren sensor.filament_ams_slot_1_tag … slot_5_tag.
# Die FilamentHub-App findet sie automatisch und ordnet Spule ↔ Slot zu.
#
# Optional: Feuchte-/Temperatur-Sensor SHT31-D (oder SHT40 / AHT20), I2C, 3,3 V, z. B. in der Filament-Lagerbox:
#   Box:  SDA → GPIO21, SCL → GPIO32, VCC → 3V3, GND → GND → sensor.filament_ams_box_feuchte (Feuchte-Alarm)
#   Trockner: SDA → GPIO33, SCL → GPIO25, VCC → 3V3, GND → GND → sensor.filament_ams_trockner_feuchte (externer Spulentrockner mit der 5. Spule)
#   Ohne angeschlossenen Sensor läuft alles andere normal weiter (im Log steht dann nur eine Warnung).
#
# Optional: Status-LED (WS2812B-Streifen, 5 V) am SELBEN ESP32, zeigt den Druckerstatus (statt eines zweiten ESP32 mit WLED):
#   Streifen: DIN → GPIO27, GND → GND (gemeinsam mit dem ESP32), 5V → eigenes 5-V-Netzteil (nicht der 3V3-Pin!)
#   → light.filament_ams_status_led + number.filament_ams_status_led_intensity. Die FilamentHub-App findet beides selbst
#   (gleiche Effekt-Namen wie WLED: Percent, Solid, Blink, Breathe) und legt die Automation an.
#   Ohne angeschlossenen Streifen läuft alles andere normal weiter.
#
# Pins funktionieren auf ESP32-Boards mit 30 UND 38 Pins (DevKitC / NodeMCU, WROOM-32).

substitutions:
  name: filament-ams
  friendly_name: Filament AMS
  # Wie lange ein Tag „weg“ sein darf, bevor der Slot als leer gilt.
  # Die Spule dreht sich beim Drucken, der Tag ist dann kurz nicht vor dem Leser.
  remove_after: 10min
  # Nur eigene NTAG-Tags (7-Byte-Nummer, Text „04-A1-B2-C3-D4-E5-F6“ = 20 Zeichen) zählen.
  # Bambu-Spulen haben MIFARE-Classic-Chips mit 4-Byte-Nummer (11 Zeichen): die werden ignoriert,
  # die liest das AMS selbst und meldet sie an die App.
  own_uid_min: "20"
  # Anzahl LEDs am Streifen (60 pro Meter oder 144 pro Meter)
  led_count: "144"
  # Helligkeitsgrenze 0-1 (Netzteil 5 V 2 A: 0.15 = max ca. 1,3 A bei weiß bei 144 LEDs). Mit stärkerem Netzteil erhöhen.
  led_cap: "0.15"
  # Farbreihenfolge des Streifens. Passen die Farben nicht (Rot zeigt Grün usw.): GRB, RGB, BRG, RBG, GBR oder BGR probieren.
  # Üblich: GRB (WS2812B). Zeigt Rot ein Grün: RGB. Zeigt Rot ein Blau: BRG.
  led_order: "GRB"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret filament_ams_api_key

ota:
  - platform: esphome
    password: !secret filament_ams_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Filament-AMS Setup"

captive_portal:

# I2C für die optionalen Feuchte-Sensoren (GPIO22 ist schon RST der Leser, deshalb SCL auf GPIO32).
# Zwei getrennte Busse, weil der SHT31-D eine feste Adresse (0x44) hat: Box an Bus 1, externer Spulentrockner an Bus 2.
# 50 kHz statt 100 kHz: stabiler bei längeren Kabeln (bis ca. 1–2 m).
i2c:
  - id: bus_box
    sda: GPIO21
    scl: GPIO32
    frequency: 50kHz
    scan: true
  - id: bus_trockner
    sda: GPIO33
    scl: GPIO25
    frequency: 50kHz
    scan: true

# Gemeinsamer SPI-Bus (VSPI) für alle 5 Leser
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

# Je Leser eine eigene CS-Leitung (SDA am RC522). RST aller Leser an GPIO22.
# v1.142: Abfrage alle 250 ms (vorher 1 s) = Tag wird 4x schneller erkannt; SPI 1 MHz (statt 4 MHz) = stabiler bei langen Kabeln.
# Hinweis: nur 7-Byte-UID-Tags (NTAG) werden angenommen (own_uid_min). 4-Byte-Tags (MIFARE Classic/Bambu) werden absichtlich ignoriert -> own_uid_min "11" setzen, falls Tags 'gar nicht' gehen.
rc522_spi:
  - id: reader_1
    cs_pin: GPIO5
    reset_pin: GPIO22
    update_interval: 250ms
    data_rate: 1MHz
    on_tag:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.stop: clear_1
              - text_sensor.template.publish: { id: slot_1_tag, state: !lambda "return x;" }
            else:
              - logger.log:
                  format: "Slot 1: fremder Tag %s ignoriert (Bambu-RFID?)"
                  args: ["x.c_str()"]
    on_tag_removed:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.execute: clear_1
  - id: reader_2
    cs_pin: GPIO17
    update_interval: 250ms
    data_rate: 1MHz
    on_tag:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.stop: clear_2
              - text_sensor.template.publish: { id: slot_2_tag, state: !lambda "return x;" }
            else:
              - logger.log:
                  format: "Slot 2: fremder Tag %s ignoriert (Bambu-RFID?)"
                  args: ["x.c_str()"]
    on_tag_removed:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.execute: clear_2
  - id: reader_3
    cs_pin: GPIO16
    update_interval: 250ms
    data_rate: 1MHz
    on_tag:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.stop: clear_3
              - text_sensor.template.publish: { id: slot_3_tag, state: !lambda "return x;" }
            else:
              - logger.log:
                  format: "Slot 3: fremder Tag %s ignoriert (Bambu-RFID?)"
                  args: ["x.c_str()"]
    on_tag_removed:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.execute: clear_3
  - id: reader_4
    cs_pin: GPIO4
    update_interval: 250ms
    data_rate: 1MHz
    on_tag:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.stop: clear_4
              - text_sensor.template.publish: { id: slot_4_tag, state: !lambda "return x;" }
            else:
              - logger.log:
                  format: "Slot 4: fremder Tag %s ignoriert (Bambu-RFID?)"
                  args: ["x.c_str()"]
    on_tag_removed:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.execute: clear_4
  - id: reader_5
    cs_pin: GPIO13
    update_interval: 250ms
    data_rate: 1MHz
    on_tag:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.stop: clear_5
              - text_sensor.template.publish: { id: slot_5_tag, state: !lambda "return x;" }
            else:
              - logger.log:
                  format: "Slot 5: fremder Tag %s ignoriert (Bambu-RFID?)"
                  args: ["x.c_str()"]
    on_tag_removed:
      then:
        - if:
            condition:
              lambda: "return x.size() >= ${own_uid_min};"
            then:
              - script.execute: clear_5

# Slot erst nach "remove_after" als leer melden (Spule dreht sich beim Drucken)
script:
  - id: clear_1
    mode: restart
    then:
      - delay: ${remove_after}
      - text_sensor.template.publish: { id: slot_1_tag, state: "" }
  - id: clear_2
    mode: restart
    then:
      - delay: ${remove_after}
      - text_sensor.template.publish: { id: slot_2_tag, state: "" }
  - id: clear_3
    mode: restart
    then:
      - delay: ${remove_after}
      - text_sensor.template.publish: { id: slot_3_tag, state: "" }
  - id: clear_4
    mode: restart
    then:
      - delay: ${remove_after}
      - text_sensor.template.publish: { id: slot_4_tag, state: "" }
  - id: clear_5
    mode: restart
    then:
      - delay: ${remove_after}
      - text_sensor.template.publish: { id: slot_5_tag, state: "" }

# Status-LED: ein Streifen am selben ESP32 (GPIO27 ist frei). Die App steuert ihn wie einen WLED-Streifen:
# Effekte heißen wie bei WLED, damit sie ihn erkennt: "Percent" (Fortschrittsbalken), "Solid", "Blink", "Breathe".
# Die Länge des Balkens steht im Regler "Status LED Intensity" (0-255 = 0-100 %), den die App aus dem Druckfortschritt setzt.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: GPIO27
    num_leds: ${led_count}
    chipset: WS2812
    rgb_order: ${led_order}
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    # Ohne Gamma-Kurve (Standard 2.8 würde bei kleinen Werten die Farben verfälschen, z. B. Bernstein wird Gelbgrün).
    gamma_correct: 1.0
    effects:
      # Einfarbig (Pause, Fertig)
      - addressable_lambda:
          name: "Solid"
          update_interval: 1s
          lambda: |-
            it.all() = current_color * (uint8_t) (255 * ${led_cap});
      # Fortschrittsbalken: so viele LEDs an, wie der Regler sagt (mindestens 1)
      - addressable_lambda:
          name: "Percent"
          update_interval: 500ms
          lambda: |-
            int n = it.size();
            int on = (int) roundf(n * id(led_intensity).state / 255.0f);
            if (on < 1) on = 1;
            if (on > n) on = n;
            for (int i = 0; i < n; i++) it[i] = (i < on) ? current_color * (uint8_t) (255 * ${led_cap}) : Color::BLACK;
      # Farbtest: zeigt nacheinander Rot, Grün, Blau (je 2 s), egal welche Farbe gewählt ist. Zum Finden von led_order.
      - addressable_lambda:
          name: "Farbtest"
          update_interval: 200ms
          lambda: |-
            int phase = (millis() / 2000) % 3;
            Color c = (phase == 0) ? Color(255, 0, 0) : ((phase == 1) ? Color(0, 255, 0) : Color(0, 0, 255));
            it.all() = c * (uint8_t) (255 * ${led_cap});
      # Blinken (Fehler): 0,5 s an, 0,5 s aus
      - addressable_lambda:
          name: "Blink"
          update_interval: 500ms
          lambda: |-
            static bool on = false;
            on = !on;
            it.all() = on ? current_color * (uint8_t) (255 * ${led_cap}) : Color::BLACK;
      # Atmen (Trocknung): langsam heller und dunkler, ca. 4 s pro Zug
      - addressable_lambda:
          name: "Breathe"
          update_interval: 40ms
          lambda: |-
            float t = (millis() % 4000) / 4000.0f;
            float b = 0.15f + 0.85f * (0.5f - 0.5f * cosf(t * 6.2831853f));
            it.all() = current_color * (uint8_t) (255.0f * ${led_cap} * b);

number:
  - platform: template
    id: led_intensity
    name: "Status LED Intensity"
    icon: mdi:chart-timeline-variant
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 128
    optimistic: true
    restore_value: true
    mode: slider

text_sensor:
  - platform: template
    id: slot_1_tag
    name: "Slot 1 Tag"
    icon: mdi:nfc-variant
  - platform: template
    id: slot_2_tag
    name: "Slot 2 Tag"
    icon: mdi:nfc-variant
  - platform: template
    id: slot_3_tag
    name: "Slot 3 Tag"
    icon: mdi:nfc-variant
  - platform: template
    id: slot_4_tag
    name: "Slot 4 Tag"
    icon: mdi:nfc-variant
  - platform: template
    id: slot_5_tag
    name: "Slot 5 Tag"
    icon: mdi:nfc-variant
  - platform: wifi_info
    ip_address:
      name: "IP"

sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
  - platform: internal_temperature
    name: "ESP32 Temperatur"
    update_interval: 60s
  # Optional: SHT31-D (auch SHT30/SHT35) in der Lagerbox → sensor.filament_ams_box_feuchte
  - platform: sht3xd
    i2c_id: bus_box
    address: 0x44
    update_interval: 10s
    temperature:
      name: "Box Temperatur"
    humidity:
      name: "Box Feuchte"
  # Optional: zweiter SHT31-D im externen Spulentrockner (5. Spule) → sensor.filament_ams_trockner_feuchte
  # Die App vergleicht beide: hält die Box dicht, arbeitet das Trockenmittel?
  - platform: sht3xd
    i2c_id: bus_trockner
    address: 0x44
    update_interval: 10s
    temperature:
      name: "Trockner Temperatur"
    humidity:
      name: "Trockner Feuchte"
  # Anderer Sensor? Block oben löschen und den passenden nehmen (# vorne entfernen):
  # SHT40 / SHT41 / SHT45:
  # - platform: sht4x
  #   i2c_id: bus_box
  #   update_interval: 60s
  #   temperature:
  #     name: "Box Temperatur"
  #   humidity:
  #     name: "Box Feuchte"
  # AHT20:
  # - platform: aht10
  #   i2c_id: bus_box
  #   variant: AHT20
  #   update_interval: 60s
  #   temperature:
  #     name: "Box Temperatur"
  #   humidity:
  #     name: "Box Feuchte"
